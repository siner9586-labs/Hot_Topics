# Organization deployment trigger: 2026-08-21
name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'workers/**'
      - 'packages/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Publish deployment pending status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=cloudflare/production \
            -f description='Cloudflare production deployment in progress' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: corepack enable && corepack prepare pnpm@11.18.0 --activate
      - run: pnpm install --no-frozen-lockfile

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets.'
            missing=1
          else
            echo 'CLOUDFLARE_API_TOKEN is configured.'
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID is not configured as a GitHub Actions secret or repository variable.'
            missing=1
          else
            echo 'CLOUDFLARE_ACCOUNT_ID is configured.'
          fi
          exit "$missing"

      - name: Verify Cloudflare authentication
        run: pnpm --dir workers/pipeline exec wrangler whoami

      - name: Ensure production queues
        shell: bash
        run: |
          pnpm --dir workers/pipeline exec wrangler queues create hot-topics-pipeline || true
          pnpm --dir workers/pipeline exec wrangler queues create hot-topics-pipeline-dlq || true

      - name: Deploy pipeline and provision Cloudflare resources
        run: pnpm --dir workers/pipeline exec wrangler deploy --x-provision

      - name: Apply D1 migrations
        run: pnpm --dir workers/pipeline exec wrangler d1 migrations apply hot-topics --remote

      - name: Re-deploy pipeline after schema migration
        run: pnpm --dir workers/pipeline exec wrangler deploy --x-provision

      - name: Prepare hots.ccwu.cc for Worker Custom Domain
        run: python scripts/cloudflare_custom_domain.py prepare

      - name: Build web
        run: pnpm --dir apps/web build

      - name: Deploy web Worker and Custom Domain
        id: deploy_web
        run: pnpm --dir apps/web exec wrangler deploy

      - name: Restore prior DNS if Custom Domain deployment fails
        if: failure() && steps.deploy_web.outcome == 'failure'
        continue-on-error: true
        run: python scripts/cloudflare_custom_domain.py restore

      - name: Verify Worker Custom Domain attachment
        run: python scripts/cloudflare_custom_domain.py verify

      - name: Verify Cloudflare deployment records
        shell: bash
        run: |
          pnpm --dir workers/pipeline exec wrangler deployments list
          pnpm --dir apps/web exec wrangler deployments list

      - name: Bootstrap first production collection against remote D1
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir workers/pipeline exec wrangler dev --config wrangler.bootstrap.jsonc --test-scheduled --ip 127.0.0.1 --port 8787 --log-level info > /tmp/bootstrap-wrangler.log 2>&1 &
          DEV_PID=$!
          cleanup() { kill "$DEV_PID" 2>/dev/null || true; wait "$DEV_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8787/health -o /tmp/pre-bootstrap-health.json 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo '::error::Wrangler bootstrap server did not become ready.'
            tail -n 250 /tmp/bootstrap-wrangler.log || true
            exit 1
          fi

          if python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('/tmp/pre-bootstrap-health.json').read_text())
          empty=int(h.get('topic_count') or 0) == 0 or int(h.get('snapshot_count') or 0) == 0
          print('PRE_BOOTSTRAP_COUNTS:', {k: h.get(k) for k in ('topic_count','raw_item_count','snapshot_count')})
          raise SystemExit(0 if empty else 1)
          PY
          then
            echo 'Production D1 has no published snapshot; invoking one scheduled-handler bootstrap.'
            curl --fail-with-body --silent --show-error 'http://127.0.0.1:8787/__scheduled' -o /tmp/bootstrap-trigger.txt
          else
            echo 'Production D1 already has published data; bootstrap invocation skipped.'
          fi

          populated=0
          for _ in $(seq 1 180); do
            if curl --silent --fail http://127.0.0.1:8787/health -o /tmp/bootstrap-health-final.json 2>/dev/null; then
              if python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('/tmp/bootstrap-health-final.json').read_text())
          ok=int(h.get('raw_item_count') or 0) > 0 and int(h.get('topic_count') or 0) > 0 and int(h.get('snapshot_count') or 0) > 0
          raise SystemExit(0 if ok else 1)
          PY
              then populated=1; break; fi
            fi
            sleep 2
          done
          if [ "$populated" -ne 1 ]; then
            echo '::error::Production D1 still lacks a complete hotspot snapshot after bootstrap.'
            tail -n 350 /tmp/bootstrap-wrangler.log || true
            cat /tmp/bootstrap-health-final.json 2>/dev/null || true
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('/tmp/bootstrap-health-final.json').read_text())
          print('POST_BOOTSTRAP_COUNTS:', {k: h.get(k) for k in ('topic_count','raw_item_count','snapshot_count')})
          print('LAST_RUN_PRESENT:', bool(h.get('last_run')))
          PY

      - name: Custom-domain and rendered-hotspot acceptance
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM_URL='https://hots.ccwu.cc'
          curl --fail-with-body --silent --show-error --retry 30 --retry-delay 4 --retry-all-errors "$CUSTOM_URL/" -o /tmp/final-custom.html
          curl --fail-with-body --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$CUSTOM_URL/?region=CN" -o /tmp/final-cn.html
          curl --fail-with-body --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$CUSTOM_URL/?region=GLOBAL" -o /tmp/final-global.html
          python - <<'PY'
          from pathlib import Path
          home=Path('/tmp/final-custom.html').read_text()
          cn=Path('/tmp/final-cn.html').read_text()
          gl=Path('/tmp/final-global.html').read_text()
          for label, html in [('home',home),('CN',cn),('GLOBAL',gl)]:
              assert '<html' in html.lower() and len(html) > 1000, f'{label} did not return rendered HTML'
              assert '尚无生产快照' not in html, f'{label} still reports no production snapshot'
          assert '暂无可用热点数据' not in cn, 'CN ranking is empty on custom domain'
          assert '暂无可用热点数据' not in gl, 'GLOBAL ranking is empty on custom domain'
          assert 'class="topic-list"' in cn, 'CN topic list was not rendered'
          assert 'class="topic-list"' in gl, 'GLOBAL topic list was not rendered'
          print('CUSTOM_DOMAIN_OK: https://hots.ccwu.cc/')
          print('HOME_BYTES:', len(home.encode()))
          print('CN_BYTES:', len(cn.encode()))
          print('GLOBAL_BYTES:', len(gl.encode()))
          PY

      - name: Publish deployment result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          description='Cloudflare production deployment failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Cloudflare production deployment succeeded'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context=cloudflare/production \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
