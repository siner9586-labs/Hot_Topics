# Organization deployment trigger: 2026-08-21
name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'workers/**'
      - 'packages/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Publish deployment pending status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=cloudflare/production \
            -f description='Cloudflare production deployment in progress' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: corepack enable && corepack prepare pnpm@11.18.0 --activate
      - run: pnpm install --no-frozen-lockfile

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets.'
            missing=1
          else
            echo 'CLOUDFLARE_API_TOKEN is configured.'
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID is not configured as a GitHub Actions secret or repository variable.'
            missing=1
          else
            echo 'CLOUDFLARE_ACCOUNT_ID is configured.'
          fi
          exit "$missing"

      - name: Verify Cloudflare authentication
        run: pnpm --dir workers/pipeline exec wrangler whoami

      - name: Ensure production queues
        shell: bash
        run: |
          pnpm --dir workers/pipeline exec wrangler queues create hot-topics-pipeline || true
          pnpm --dir workers/pipeline exec wrangler queues create hot-topics-pipeline-dlq || true

      - name: Deploy pipeline and provision Cloudflare resources
        run: pnpm --dir workers/pipeline exec wrangler deploy --x-provision

      - name: Apply D1 migrations
        run: pnpm --dir workers/pipeline exec wrangler d1 migrations apply hot-topics --remote

      - name: Re-deploy pipeline after schema migration
        run: pnpm --dir workers/pipeline exec wrangler deploy --x-provision

      - name: Rotate protected production run token
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_RUN_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$ADMIN_RUN_TOKEN"
          echo "ADMIN_RUN_TOKEN=$ADMIN_RUN_TOKEN" >> "$GITHUB_ENV"
          printf '%s' "$ADMIN_RUN_TOKEN" | pnpm --dir workers/pipeline exec wrangler secret put ADMIN_RUN_TOKEN

      - name: Re-deploy pipeline after run-token rotation
        run: pnpm --dir workers/pipeline exec wrangler deploy --x-provision

      - name: Resolve production pipeline URL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -o /tmp/workers-subdomain.json
          python - <<'PY' > /tmp/workers-subdomain.txt
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/workers-subdomain.json').read_text())
          if not payload.get('success'):
              raise SystemExit(f"workers subdomain lookup failed: {payload.get('errors')}")
          subdomain=(payload.get('result') or {}).get('subdomain')
          if not subdomain:
              raise SystemExit('workers subdomain missing')
          print(subdomain)
          PY
          SUBDOMAIN="$(cat /tmp/workers-subdomain.txt)"
          echo "PIPELINE_URL=https://hot-topics-pipeline.${SUBDOMAIN}.workers.dev" >> "$GITHUB_ENV"

      - name: Prepare hots.ccwu.cc for Worker Custom Domain
        run: python scripts/cloudflare_custom_domain.py prepare

      - name: Build web
        run: pnpm --dir apps/web build

      - name: Deploy web Worker and Custom Domain
        id: deploy_web
        run: pnpm --dir apps/web exec wrangler deploy

      - name: Restore prior DNS if Custom Domain deployment fails
        if: failure() && steps.deploy_web.outcome == 'failure'
        continue-on-error: true
        run: python scripts/cloudflare_custom_domain.py restore

      - name: Verify Worker Custom Domain attachment
        run: python scripts/cloudflare_custom_domain.py verify

      - name: Verify Cloudflare deployment records
        shell: bash
        run: |
          pnpm --dir workers/pipeline exec wrangler deployments list
          pnpm --dir apps/web exec wrangler deployments list

      - name: Trigger real production collection
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          accepted=0
          for attempt in $(seq 1 12); do
            http_code="$(curl --silent --show-error \
              --request POST \
              -H "Authorization: Bearer $ADMIN_RUN_TOKEN" \
              "$PIPELINE_URL/admin/run-now" \
              -o /tmp/run-now.json \
              -w '%{http_code}' || true)"
            if [ "$http_code" = '202' ]; then
              accepted=1
              break
            fi
            echo "Production trigger not ready yet (HTTP $http_code, attempt $attempt/12)."
            sleep 2
          done
          if [ "$accepted" -ne 1 ]; then
            echo '::error::Production run endpoint did not accept the protected trigger after bounded retries.'
            cat /tmp/run-now.json 2>/dev/null || true
            exit 1
          fi
          python - <<'PY' > /tmp/run-id.txt
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/run-now.json').read_text())
          run_id=payload.get('run_id')
          if not payload.get('accepted') or not run_id:
              raise SystemExit(f"production run was not accepted: {payload}")
          print(run_id)
          PY
          PRODUCTION_RUN_ID="$(cat /tmp/run-id.txt)"
          echo "PRODUCTION_RUN_ID=$PRODUCTION_RUN_ID" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/run-now.json').read_text())
          print('COLLECTED_RAW_ITEMS:', payload.get('collected'))
          print('SOURCE_RESULTS:')
          for row in payload.get('source_results',[]):
              print(f"  {row.get('source')}: {row.get('status')} ({row.get('item_count')} items)")
          PY

      - name: Wait for CN and GLOBAL production snapshots
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          complete=0
          for _ in $(seq 1 150); do
            if curl --silent --show-error --fail \
              -H "Authorization: Bearer $ADMIN_RUN_TOKEN" \
              "$PIPELINE_URL/admin/run-status?run_id=$PRODUCTION_RUN_ID" \
              -o /tmp/run-status.json; then
              if python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/run-status.json').read_text())
          run=payload.get('run') or {}
          counts=payload.get('region_counts') or {}
          status=run.get('status')
          cn=int(counts.get('CN') or 0)
          gl=int(counts.get('GLOBAL') or 0)
          print(f"RUN_STATUS={status} CN_SNAPSHOTS={cn} GLOBAL_SNAPSHOTS={gl}")
          if status == 'FAILED':
              raise SystemExit(2)
          raise SystemExit(0 if status in {'PUBLISHED','PARTIAL'} and cn > 0 and gl > 0 else 1)
          PY
              then complete=1; break; fi
            fi
            sleep 4
          done
          if [ "$complete" -ne 1 ]; then
            echo '::error::Production run did not reach a terminal state with snapshots in both CN and GLOBAL.'
            cat /tmp/run-status.json 2>/dev/null || true
            exit 1
          fi
          cat /tmp/run-status.json

      - name: Verify production source coverage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "$PIPELINE_URL/api/v1/source-health" -o /tmp/source-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=(json.loads(Path('/tmp/source-health.json').read_text()).get('data') or [])
          working={'CN':0,'GLOBAL':0}
          print('PRODUCTION_SOURCE_HEALTH:')
          for row in rows:
              region=str(row.get('region') or '')
              status=str(row.get('status') or '')
              count=int(row.get('item_count') or 0)
              print(f"  {region:6} {str(row.get('id')):20} {status:16} items={count}")
              if region in working and status in {'healthy','degraded'} and count >= 3:
                  working[region]+=1
          print('WORKING_SOURCES:', working)
          assert working['CN'] >= 4, f"CN source coverage below floor: {working['CN']} < 4"
          assert working['GLOBAL'] >= 5, f"GLOBAL source coverage below floor: {working['GLOBAL']} < 5"
          PY

      - name: Custom-domain and rendered-hotspot acceptance
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM_URL='https://hots.ccwu.cc'
          curl --fail-with-body --silent --show-error --retry 30 --retry-delay 4 --retry-all-errors "$CUSTOM_URL/" -o /tmp/final-custom.html
          curl --fail-with-body --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$CUSTOM_URL/?region=CN" -o /tmp/final-cn.html
          curl --fail-with-body --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$CUSTOM_URL/?region=GLOBAL" -o /tmp/final-global.html
          python - <<'PY'
          from pathlib import Path
          home=Path('/tmp/final-custom.html').read_text()
          cn=Path('/tmp/final-cn.html').read_text()
          gl=Path('/tmp/final-global.html').read_text()
          for label, html in [('home',home),('CN',cn),('GLOBAL',gl)]:
              assert '<html' in html.lower() and len(html) > 1000, f'{label} did not return rendered HTML'
              assert '尚无生产快照' not in html, f'{label} still reports no production snapshot'
          assert '暂无可用热点数据' not in cn, 'CN ranking is empty on custom domain'
          assert '暂无可用热点数据' not in gl, 'GLOBAL ranking is empty on custom domain'
          assert 'class="topic-list"' in cn, 'CN topic list was not rendered'
          assert 'class="topic-list"' in gl, 'GLOBAL topic list was not rendered'
          print('CUSTOM_DOMAIN_OK: https://hots.ccwu.cc/')
          print('HOME_BYTES:', len(home.encode()))
          print('CN_BYTES:', len(cn.encode()))
          print('GLOBAL_BYTES:', len(gl.encode()))
          PY

      - name: Publish deployment result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          description='Cloudflare production deployment failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Cloudflare production deployment succeeded'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context=cloudflare/production \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
