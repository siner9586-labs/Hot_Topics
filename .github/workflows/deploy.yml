# Organization deployment trigger: 2026-08-21
name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'workers/**'
      - 'packages/**'
      - 'migrations/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Publish deployment pending status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=cloudflare/production \
            -f description='Cloudflare production deployment in progress' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: corepack enable && corepack prepare pnpm@11.18.0 --activate
      - run: pnpm install --no-frozen-lockfile

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets.'
            missing=1
          else
            echo 'CLOUDFLARE_API_TOKEN is configured.'
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID is not configured as a GitHub Actions secret or repository variable.'
            missing=1
          else
            echo 'CLOUDFLARE_ACCOUNT_ID is configured.'
          fi
          exit "$missing"

      - name: Verify Cloudflare authentication
        run: pnpm --dir workers/pipeline exec wrangler whoami

      - name: Ensure production queues
        shell: bash
        run: |
          pnpm --dir workers/pipeline exec wrangler queues create hot-topics-pipeline || true
          pnpm --dir workers/pipeline exec wrangler queues create hot-topics-pipeline-dlq || true

      - name: Deploy pipeline and provision Cloudflare resources
        run: pnpm --dir workers/pipeline exec wrangler deploy --x-provision

      - name: Apply D1 migrations
        run: pnpm --dir workers/pipeline exec wrangler d1 migrations apply hot-topics --remote

      - name: Re-deploy pipeline after schema migration
        run: pnpm --dir workers/pipeline exec wrangler deploy --x-provision

      - name: Build web
        run: pnpm --dir apps/web build

      - name: Deploy web Worker
        run: pnpm --dir apps/web exec wrangler deploy

      - name: Verify Cloudflare deployment records
        shell: bash
        run: |
          pnpm --dir workers/pipeline exec wrangler deployments list
          pnpm --dir apps/web exec wrangler deployments list

      - name: Production HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          PIPELINE_URL='https://hot-topics-pipeline.zz9w9z.workers.dev'
          WEB_URL='https://hot-topics-web.zz9w9z.workers.dev'
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$PIPELINE_URL/health" -o /tmp/health.json
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$PIPELINE_URL/api/v1/topics?limit=3" -o /tmp/topics.json
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$WEB_URL/" -o /tmp/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path('/tmp/health.json').read_text())
          topics=json.loads(Path('/tmp/topics.json').read_text())
          html=Path('/tmp/index.html').read_text()
          assert isinstance(health, dict), health
          assert isinstance(topics, dict) and isinstance(topics.get('data'), list), topics
          assert '<html' in html.lower() and len(html) > 500, 'web response did not look like rendered HTML'
          print('HEALTH:', json.dumps(health, ensure_ascii=False)[:1000])
          print('TOPIC_COUNT_SAMPLE:', len(topics['data']))
          print('WEB_BYTES:', len(html.encode()))
          PY

      - name: Publish deployment result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          description='Cloudflare production deployment failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Cloudflare production deployment succeeded'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context=cloudflare/production \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
